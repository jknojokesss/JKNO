name: Weldon Sync

# Pulls new Weldon orders into Supabase nightly. Read-only on Weldon's side:
# it logs in, reads the order-history pages, and writes only to our own DB.
on:
  # NOTE: Weldon sits behind a Cloudflare bot challenge that blocks datacenter
  # (GitHub Actions) IPs, so the cloud-scheduled run can't get past the login
  # wall. The nightly schedule is disabled. Kept as workflow_dispatch only for
  # reference; the working path is running this from a residential IP/real
  # browser session (see weldon-sync/README or run the local pull).
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: weldon-sync
        run: npm install

      - name: Install Chromium for Playwright
        working-directory: weldon-sync
        run: npx playwright install --with-deps chromium

      - name: Run Weldon sync
        working-directory: weldon-sync
        env:
          WELDON_USER:                ${{ secrets.WELDON_USER }}
          WELDON_PASS:                ${{ secrets.WELDON_PASS }}
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync.mjs
